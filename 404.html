    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="GIGS" />
    <title>GIGS 收益统计</title>
    <script>
      /*! 启动保护（内联，不依赖任何外部资源）：
          1) 主屏幕 standalone 冷启动落在深链时自动纠正回根地址
          2) 主 JS 加载失败自动快速重试；兜底后每 20 秒慢速自动重试（网络恢复即自愈）
          3) 启动显示 loading；20 秒未挂载显示兜底界面 + 诊断信息（便于定位），杜绝纯白屏 */
      (function () {
        var RETRY_KEY = 'gigs_boot_retry';
        var MOUNT_FLAG = '__GIGS_MOUNTED__';
        var errors = [];

        function isStandalone() {
          return (
            window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
          );
        }

        function deriveBase() {
          var s = document.querySelector('script[type=module][src]');
          if (s) {
            var src = s.getAttribute('src') || '';
            var p = src;
            if (src.indexOf('http') === 0) {
              try { p = new URL(src).pathname; } catch (e) {}
            }
            var i = p.indexOf('/assets/');
            if (i >= 0) return p.substring(0, i + 1);
          }
          if (location.hostname.indexOf('.github.io') !== -1) {
            var seg = location.pathname.split('/')[1];
            if (seg) return '/' + seg + '/';
          }
          return '/';
        }

        function isRootPath(base, pathname) {
          return pathname === base || pathname === base.replace(/\/$/, '') || pathname === base + 'index.html';
        }

        // 1) 深链纠正（仅主屏幕 standalone 模式）
        if (isStandalone()) {
          var base0 = deriveBase();
          if (!isRootPath(base0, location.pathname)) {
            location.replace(base0);
          }
        }

        function getRetry() {
          try {
            var raw = localStorage.getItem(RETRY_KEY);
            if (!raw) return { n: 0, t: 0 };
            var obj = JSON.parse(raw);
            if (!obj || Date.now() - (obj.t || 0) > 60000) return { n: 0, t: 0 };
            return obj;
          } catch (e) { return { n: 0, t: 0 }; }
        }
        function setRetry(n) {
          try { localStorage.setItem(RETRY_KEY, JSON.stringify({ n: n, t: Date.now() })); } catch (e) {}
        }

        // 2) 轻量启动 loading
        function showBoot() {
          if (document.getElementById('gigs-boot') || !document.body) return;
          var d = document.createElement('div');
          d.id = 'gigs-boot';
          d.style.cssText =
            'position:fixed;inset:0;z-index:9998;background:#f9fafb;display:flex;flex-direction:column;' +
            'align-items:center;justify-content:center;gap:14px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
          d.innerHTML =
            '<div style="width:30px;height:30px;border:3px solid #e5e7eb;border-top-color:#1f2937;' +
            'border-radius:50%;animation:gigsspin .8s linear infinite"></div>' +
            '<div style="color:#9ca3af;font-size:13px;">加载中，首次启动可能需要几十秒...</div>' +
            '<style>@keyframes gigsspin{to{transform:rotate(360deg)}}</style>';
          document.body.appendChild(d);
        }
        if (document.body) showBoot();
        else document.addEventListener('DOMContentLoaded', showBoot);

        function hideBoot() {
          var d = document.getElementById('gigs-boot');
          if (d && d.parentNode) d.parentNode.removeChild(d);
        }

        // 3) 错误捕获：资源加载失败 → 快速重试；运行时错误 → 记录用于诊断
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            if (t && t.tagName && t !== window) {
              if (t.tagName === 'SCRIPT') {
                errors.push('JS文件加载失败: ' + String(t.src || '').split('/').pop());
                var info = getRetry();
                if (info.n < 3) {
                  setRetry(info.n + 1);
                  setTimeout(function () { window.location.reload(); }, 1200);
                }
              }
            } else if (e && e.message) {
              errors.push('运行错误: ' + String(e.message).slice(0, 150) + (e.lineno ? ' (行' + e.lineno + ')' : ''));
            }
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          errors.push('Promise错误: ' + String((r && (r.message || (r.toString && r.toString()))) || r || '未知').slice(0, 150));
        });

        function hasRuntimeError() {
          for (var i = 0; i < errors.length; i++) {
            if (errors[i].indexOf('加载失败') === -1) return true;
          }
          return false;
        }

        // 4) 诊断信息（显示在兜底界面，便于截图排查）
        function diagText() {
          var L = [];
          L.push('路径: ' + location.pathname);
          L.push('网络: ' + (navigator.onLine ? '在线' : '离线'));
          L.push('快速重试: ' + getRetry().n + ' 次');
          try {
            if ('serviceWorker' in navigator) {
              L.push('离线缓存: ' + (navigator.serviceWorker.controller ? '已启用' : '未启用(冷启动)'));
            } else {
              L.push('离线缓存: 浏览器不支持');
            }
          } catch (e) {}
          var jsSeen = false;
          try {
            var ents = performance.getEntriesByType('resource');
            for (var i = 0; i < ents.length; i++) {
              var en = ents[i];
              if (en.name.indexOf('/assets/') !== -1 && en.name.indexOf('.js') !== -1) {
                jsSeen = true;
                L.push('主程序: 已下载 ' + Math.round((en.encodedBodySize || 0) / 1024) + 'KB / 耗时 ' + (Math.round(en.duration) / 1000) + '秒');
              }
            }
          } catch (e) {}
          if (!jsSeen) L.push('主程序: 未开始下载或下载中断');
          var rootEl = document.getElementById('root');
          L.push('页面内容: ' + (rootEl ? rootEl.childElementCount : 0) + ' 块');
          if (errors.length) L.push('最后错误: ' + errors.slice(-2).join(' | ').slice(0, 300));
          return L.join('\n');
        }

        // 5) 超时未挂载 → 兜底界面（手动按钮 + 诊断 + 慢速自动重试）
        function showFallback() {
          if (window[MOUNT_FLAG] || !document.body) return;
          hideBoot();
          var d = document.getElementById('gigs-fallback');
          if (!d) {
            d = document.createElement('div');
            d.id = 'gigs-fallback';
            d.style.cssText =
              'position:fixed;inset:0;z-index:9999;background:#ffffff;display:flex;flex-direction:column;' +
              'align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;' +
              'font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow-y:auto;';
            d.innerHTML =
              '<div style="font-size:22px;font-weight:700;color:#111827;letter-spacing:1px;margin-top:20px;">GIGS</div>' +
              '<div style="font-size:14px;color:#6b7280;line-height:1.7;">网络较慢，应用没有加载成功<br/>将自动重试，也可点击按钮立即重试</div>' +
              '<button type="button" id="gigs-reload-btn" style="margin-top:8px;padding:12px 40px;font-size:15px;' +
              'font-weight:600;color:#ffffff;background:#1f2937;border:none;border-radius:999px;-webkit-appearance:none;">重新加载</button>' +
              '<pre id="gigs-diag" style="margin-top:18px;padding:12px 14px;background:#f3f4f6;border-radius:10px;' +
              'font-size:11px;color:#9ca3af;text-align:left;white-space:pre-wrap;word-break:break-all;width:100%;' +
              'max-width:340px;line-height:1.6;"></pre>';
            document.body.appendChild(d);
            var btn = document.getElementById('gigs-reload-btn');
            if (btn) {
              btn.onclick = function () {
                setRetry(0);
                window.location.reload();
              };
            }
          }
          var diag = document.getElementById('gigs-diag');
          if (diag) diag.textContent = diagText();
        }
        setTimeout(function () {
          if (window[MOUNT_FLAG]) hideBoot();
          else showFallback();
        }, 20000);

        // 兜底后每 20 秒慢速自动重试（仅限资源/网络问题；程序运行时错误不自动刷新，避免死循环）
        setInterval(function () {
          if (window[MOUNT_FLAG]) return;
          if (!document.getElementById('gigs-fallback')) return;
          if (hasRuntimeError()) return;
          window.location.reload();
        }, 20000);

        // 应用挂载成功后清理一切
        var watch = setInterval(function () {
          if (window[MOUNT_FLAG]) {
            hideBoot();
            var f = document.getElementById('gigs-fallback');
            if (f && f.parentNode) f.parentNode.removeChild(f);
            try { localStorage.removeItem(RETRY_KEY); } catch (e) {}
            clearInterval(watch);
          }
        }, 300);
      })();
    </script>
