<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/dewu-seller-app/icon-512.png" />
    <link rel="shortcut icon" type="image/png" href="/dewu-seller-app/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/dewu-seller-app/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GIGS" />
    <title>GIGS 收益统计</title>
    <style>
      /* 静态登录外壳样式（不依赖任何外部文件，点开图标立即显示） */
      .g-shell * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      .g-shell {
        position: fixed; inset: 0; background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 16px;
      }
      .g-card { width: 100%; max-width: 420px; }
      .g-logo { text-align: center; margin-bottom: 28px; padding-top: 24px; }
      .g-logo span { color: #111827; font-size: 30px; font-weight: 700; letter-spacing: 3px; }
      .g-box {
        background: rgba(255,255,255,.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border-radius: 24px; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,.08); border: 1px solid #f3f4f6;
      }
      .g-tabs { display: flex; background: #f3f4f6; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
      .g-tab { flex: 1; padding: 10px 0; text-align: center; font-size: 14px; font-weight: 500; border-radius: 8px; border: none; background: transparent; color: #6b7280; }
      .g-tab.on { background: #fff; color: #111827; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
      .g-field { margin-bottom: 14px; }
      .g-label { display: block; color: #374151; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
      .g-input {
        width: 100%; padding: 11px 14px 11px 38px; background: #fff; border: 1px solid #e5e7eb;
        border-radius: 12px; color: #111827; font-size: 14px; outline: none;
      }
      .g-input::-moz-placeholder { color: #9ca3af; }
      .g-input::placeholder { color: #9ca3af; }
      .g-wrap { position: relative; }
      .g-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: #9ca3af; }
      .g-btn {
        width: 100%; margin-top: 4px; padding: 13px 0; background: #111827; color: #fff; border: none;
        border-radius: 12px; font-size: 14px; font-weight: 500; box-shadow: 0 6px 16px rgba(0,0,0,.15);
      }
      .g-btn:disabled { opacity: .6; }
      .g-foot { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 22px; line-height: 1.8; }
      .g-loadhint { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 14px; color: #9ca3af; font-size: 12px; }
      .g-spin { width: 13px; height: 13px; border: 2px solid #e5e7eb; border-top-color: #6b7280; border-radius: 50%; animation: gspin .8s linear infinite; }
      @keyframes gspin { to { transform: rotate(360deg); } }
      /* 崩溃黑匣子：任何未被捕获的 JS 错误都显示在屏幕上，白屏变红字报错屏 */
      .g-crash {
        position: fixed; inset: 0; z-index: 10000; background: #ffffff; display: flex;
        flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: 26px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .g-crash-title { font-size: 18px; font-weight: 700; color: #dc2626; }
      .g-crash-msg { font-size: 12px; color: #ef4444; background: #fef2f2; border: 1px solid #fecaca;
        border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; word-break: break-all; max-width: 360px; line-height: 1.6; }
      .g-crash-btn { padding: 11px 36px; font-size: 14px; font-weight: 600; color: #fff; background: #1f2937;
        border: none; border-radius: 999px; -webkit-appearance: none; }
    </style>
    <script>
      /*! 启动保护（内联，极简）：
          1) standalone 深链纠正：桌面图标冷启动落在内页时自动回到根地址
          2) 静态登录外壳：点开图标立即看到登录页（#root 内），React 加载完成后自动替换为真实界面
          3) 新 Service Worker 接管（新版本缓存就绪）且应用尚未挂载时自动刷新一次，避免“新网页+旧缓存”互相等待
          4) 崩溃黑匣子：任何 JS 运行时错误 / Promise 异常，都把错误信息直接显示到屏幕（而不是白屏），便于定位 */
      (function () {
        var RETRY_KEY = 'gigs_boot_retry';
        var crashed = false;

        function isStandalone() {
          return (
            window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
          );
        }
        function deriveBase() {
          var s = document.querySelector('script[type=module][src]');
          if (s) {
            var src = s.getAttribute('src') || '';
            var p = src;
            if (src.indexOf('http') === 0) {
              try { p = new URL(src).pathname; } catch (e) {}
            }
            var i = p.indexOf('/assets/');
            if (i >= 0) return p.substring(0, i + 1);
          }
          if (location.hostname.indexOf('.github.io') !== -1) {
            var seg = location.pathname.split('/')[1];
            if (seg) return '/' + seg + '/';
          }
          return '/';
        }
        function isRootPath(base, pathname) {
          return pathname === base || pathname === base.replace(/\/$/, '') || pathname === base + 'index.html';
        }

        // 1) 深链纠正
        if (isStandalone()) {
          var base0 = deriveBase();
          if (!isRootPath(base0, location.pathname)) {
            location.replace(base0);
          }
        }

        // 2) 崩溃黑匣子：错误上屏，白屏变报错屏
        function showCrash(msg) {
          if (crashed) return;
          crashed = true;
          var rootEl = document.getElementById('root');
          if (rootEl) rootEl.innerHTML = '';
          if (document.body) {
            var d = document.createElement('div');
            d.className = 'g-crash';
            d.innerHTML =
              '<div class="g-crash-title">程序出错了</div>' +
              '<div class="g-crash-msg"></div>' +
              '<button type="button" class="g-crash-btn">重新加载</button>';
            var msgEl = d.querySelector('.g-crash-msg');
            if (msgEl) msgEl.textContent = msg;
            d.querySelector('.g-crash-btn').onclick = function () {
              try { localStorage.removeItem(RETRY_KEY); } catch (e) {}
              window.location.reload();
            };
            document.body.appendChild(d);
          }
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          // 资源加载失败（SCRIPT/LINK）已有专门重试，这里只处理真正的运行时错误
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && t !== window) return;
          var parts = [];
          if (e && e.message) parts.push(String(e.message).slice(0, 160));
          if (e && e.filename) parts.push(String(e.filename).split('/').pop() + (e.lineno ? ' 行' + e.lineno : ''));
          showCrash(parts.length ? parts.join('\n') : ('未知错误: ' + Object.prototype.toString.call(e)));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          var m = String((r && (r.message && r.message)) || (r && r.toString && r.toString()) || r || '未知Promise错误').slice(0, 160);
          showCrash('异步错误: ' + m);
        });

        // 3) 新 SW 接管且尚未挂载 → 自动刷新一次（sessionStorage 防循环）
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (window.__GIGS_MOUNTED__ || crashed) return;
            try {
              if (sessionStorage.getItem('gigs_sw_reloaded')) return;
              sessionStorage.setItem('gigs_sw_reloaded', '1');
            } catch (e) {}
            window.location.reload();
          });
        }

        // 4) 主程序文件加载失败（网络中断）→ 自动重试
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && t !== window) {
              try {
                var raw = localStorage.getItem(RETRY_KEY);
                var info = raw ? JSON.parse(raw) : { n: 0, t: 0 };
                if (!info || Date.now() - (info.t || 0) > 120000) info = { n: 0, t: 0 };
                if (info.n < 3) {
                  info.n += 1; info.t = Date.now();
                  localStorage.setItem(RETRY_KEY, JSON.stringify(info));
                  setTimeout(function () { window.location.reload(); }, 1500);
                }
              } catch (err) {}
            }
          },
          true
        );
      })();
    </script>

  <body>
    <div id="root">
      <!-- 静态登录外壳：点开立即显示，React 挂载后自动替换 -->
      <div class="g-shell" id="g-static-shell">
        <div class="g-card">
          <div class="g-logo"><span>GIGS</span></div>
          <div class="g-box">
            <div class="g-tabs">
              <button type="button" class="g-tab on">登录</button>
              <button type="button" class="g-tab">注册</button>
            </div>
            <form onsubmit="return false;">
              <div class="g-field">
                <label class="g-label">邮箱</label>
                <div class="g-wrap">
                  <svg class="g-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
                  <input class="g-input" type="email" placeholder="请输入邮箱" autocomplete="username" />
                </div>
              </div>
              <div class="g-field">
                <label class="g-label">密码</label>
                <div class="g-wrap">
                  <svg class="g-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <input class="g-input" type="password" placeholder="请输入密码（至少6位）" autocomplete="current-password" />
                </div>
              </div>
              <button class="g-btn" type="submit" disabled>登录</button>
            </form>
            <div class="g-loadhint"><span class="g-spin"></span>应用加载中，马上就好...</div>
          </div>
          <p class="g-foot">登录后数据自动同步到云端，多设备可同时使用</p>
        </div>
      </div>
    </div>
  </body>
